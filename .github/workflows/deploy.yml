name: Deploy to Hugging Face Space
on:
  push:
    branches:
      - main # Triggers when you push to main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://Vishnuporkulath:$HF_TOKEN@https://huggingface.co/spaces/Vishnuporkulath/career-pilot main -f
